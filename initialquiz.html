<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>올초성 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Gmarket+Sans:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --surface3: #2a2a38;
    --border: #32324a;
    --accent: #4ade80;
    --accent-dim: rgba(74,222,128,0.12);
    --text: #f0f0f8;
    --text2: #9999bb;
    --text3: #55556a;
    --correct: #6bcb77;
    --wrong: #ff5555;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }

  /* ── TOPBAR ── */
  #topbar {
    height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0; z-index: 100;
  }
  .logo { font-family: 'Gmarket Sans', sans-serif; font-weight: 700; font-size: 16px; color: var(--accent); letter-spacing: -0.5px; white-space: nowrap; }
  .logo-sub { font-size: 10px; color: var(--text3); white-space: nowrap; }
  .tb-spacer { flex: 1; }
  #back-btn, #finish-btn {
    display: none; align-items: center; gap: 5px; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text2); font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  #back-btn:hover { border-color: var(--accent); color: var(--text); }
  #finish-btn { border-color: var(--accent); color: var(--accent); }
  #finish-btn:hover { background: var(--accent-dim); }
  #back-btn svg, #finish-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* ── SCREENS ── */
  .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  /* ════ SETUP ════ */
  #setup-screen { overflow-y: auto; align-items: center; padding: 28px 20px 48px; }
  .setup-inner { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 28px; }
  .setup-hero { text-align: center; }
  .setup-eyebrow { font-size: 10px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; font-family: 'Gmarket Sans', sans-serif; font-weight: 300; margin-bottom: 8px; }
  .setup-title { font-family: 'Gmarket Sans', sans-serif; font-size: clamp(24px,7vw,38px); font-weight: 700; letter-spacing: -1px; line-height: 1.15; }
  .setup-title em { font-style: normal; color: var(--accent); }
  .setup-desc { margin-top: 8px; font-size: 12px; color: var(--text3); }
  .setup-block { display: flex; flex-direction: column; gap: 10px; }
  .setup-block-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--text3); text-transform: uppercase; }
  .cat-filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-filter-btn {
    padding: 7px 16px; border-radius: 24px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text2); font-size: 13px; font-family: 'Gmarket Sans', sans-serif; font-weight: 500;
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .cat-filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .cat-filter-btn.on { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
  .count-btns { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .count-btn {
    padding: 12px 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text2); font-family: 'Gmarket Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .count-btn .count-sub { display: block; font-size: 10px; color: var(--text3); margin-top: 2px; font-weight: 300; }
  .count-btn:hover { border-color: var(--accent); color: var(--text); }
  .count-btn.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .count-btn.on .count-sub { color: var(--accent); opacity: 0.6; }
  #start-btn {
    width: 100%; padding: 15px; border-radius: 14px; border: none; background: var(--accent); color: #111;
    font-family: 'Gmarket Sans', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.15s;
  }
  #start-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  #start-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .setup-warning { font-size: 12px; color: var(--wrong); text-align: center; min-height: 16px; }
  .setup-info { font-size: 12px; color: var(--text3); text-align: center; min-height: 16px; }

  /* ════ QUIZ ════ */
  #quiz-screen { overflow: hidden; }
  #progress-bar-wrap { height: 3px; background: var(--surface2); flex-shrink: 0; }
  #progress-bar { height: 100%; background: var(--accent); transition: width 0.4s ease; width: 0%; }
  #quiz-status {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .status-qnum { font-family: 'Gmarket Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text2); }
  .status-chips { display: flex; gap: 14px; }
  .stat-chip { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .stat-chip-val { font-family: 'Gmarket Sans', sans-serif; font-size: 17px; font-weight: 700; }
  .stat-chip-val.c { color: var(--correct); }
  .stat-chip-val.w { color: var(--wrong); }
  .stat-chip-label { font-size: 9px; color: var(--text3); letter-spacing: 0.8px; }

  #quiz-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }

  /* 초성 카드 영역 */
  #chosung-area {
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 0; flex-shrink: 0; gap: 12px;
  }

  /* 힌트 토글 행 */
  #hint-row {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 28px;
  }

  /* 힌트 토글 버튼 */
  #hint-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 12px 4px 6px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text3);
    font-size: 11px;
    font-family: 'Gmarket Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  #hint-toggle:hover { border-color: var(--text3); color: var(--text2); }
  #hint-toggle.on {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }

  /* 토글 스위치 트랙 */
  .toggle-track {
    width: 28px; height: 16px;
    border-radius: 8px;
    background: var(--surface3);
    border: 1px solid var(--border);
    position: relative;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  #hint-toggle.on .toggle-track {
    background: var(--accent);
    border-color: var(--accent);
  }
  /* 토글 손잡이 */
  .toggle-thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text3);
    transition: transform 0.2s, background 0.2s;
  }
  #hint-toggle.on .toggle-thumb {
    transform: translateX(12px);
    background: #111;
  }

  /* 힌트 라벨 (카테고리 텍스트) */
  #hint-label {
    font-size: 11px;
    font-family: 'Gmarket Sans', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text3);
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    white-space: nowrap;
  }
  #hint-label.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* 초성 카드 */
  #chosung-card {
    width: min(720px, 96vw);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    padding: 28px 40px 28px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  #chosung-card.correct-state { border-color: var(--correct); box-shadow: 0 0 0 1px var(--correct), 0 8px 40px rgba(107,203,119,0.15); }
  #chosung-card.wrong-state   { border-color: var(--wrong);   box-shadow: 0 0 0 1px var(--wrong),   0 8px 40px rgba(255,85,85,0.12);  }

  #chosung-label {
    font-size: 10px; letter-spacing: 2px; color: var(--text3);
    text-transform: uppercase; font-family: 'Gmarket Sans', sans-serif; font-weight: 300;
    margin-bottom: 20px;
  }

  /* 초성/정답 공통 컨테이너: 크로스페이드 */
  #text-swap {
    position: relative;
    width: 100%;
    min-height: 1.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  /* 초성 텍스트 */
  #chosung-text {
    font-family: 'Gmarket Sans', sans-serif;
    font-size: clamp(26px, 5.5vw, 52px);
    font-weight: 700;
    letter-spacing: clamp(6px, 1.4vw, 16px);
    color: var(--accent);
    line-height: 1.2;
    white-space: nowrap;
    text-indent: clamp(6px, 1.4vw, 16px);
    transition: opacity 0.3s, transform 0.3s;
    position: absolute;
  }
  @media (max-width: 520px) {
    #chosung-text { white-space: normal; word-break: break-all; font-size: clamp(24px,8vw,36px); letter-spacing: 6px; text-indent: 6px; }
  }

  /* 정답 텍스트 (크로스페이드 대상) */
  #answer-text {
    font-family: 'Gmarket Sans', sans-serif;
    font-size: clamp(26px, 5.5vw, 52px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.35s, transform 0.35s;
    position: absolute;
    pointer-events: none;
  }
  #answer-text.correct-text { color: var(--correct); }
  #answer-text.wrong-text   { color: var(--wrong); }

  /* 페이드 아웃 상태 */
  #text-swap.revealed #chosung-text { opacity: 0; transform: scale(0.92); pointer-events: none; }
  #text-swap.revealed #answer-text  { opacity: 1; transform: scale(1); }

  /* 정오답 뱃지 — 카드 안 하단 */
  #answer-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    opacity: 0;
    transition: opacity 0.25s 0.15s;
    min-height: 14px;
  }
  #answer-badge.show { opacity: 1; }
  #answer-badge.correct-badge { color: var(--correct); }
  #answer-badge.wrong-badge   { color: var(--wrong); }

  /* 오답 시 내 입력 표시 */
  #answer-hint {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.25s 0.2s;
    min-height: 14px;
  }
  #answer-hint.show { opacity: 1; }

  /* 입력 영역 */
  #input-area {
    padding: 16px 16px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
  }
  #answer-form {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 8px;
  }
  #answer-input {
    flex: 1; padding: 13px 18px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 16px;
    font-family: 'Noto Sans KR', sans-serif; outline: none; transition: border-color 0.2s, box-shadow 0.2s; min-width: 0;
  }
  #answer-input::placeholder { color: var(--text3); }
  #answer-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  #answer-input:disabled { opacity: 0.5; cursor: not-allowed; }
  #answer-input.input-correct { border-color: var(--correct); box-shadow: 0 0 0 3px rgba(107,203,119,0.15); color: var(--correct); font-weight: 700; }
  #answer-input.input-wrong   { border-color: var(--wrong);   box-shadow: 0 0 0 3px rgba(255,85,85,0.12);   color: var(--wrong); }
  #submit-btn {
    padding: 13px 24px; border-radius: 12px; border: none; background: var(--accent); color: #111;
    font-family: 'Gmarket Sans', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
  }
  #submit-btn:hover:not(:disabled) { filter: brightness(1.08); }
  #submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-7px); }
    40%     { transform: translateX(7px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }
  .shake { animation: shake 0.35s ease; }

  /* 다음 문제 버튼 */
  #next-btn-wrap { padding: 0 16px 16px; flex-shrink: 0; display: none; max-width: 752px; width: 100%; align-self: center; }
  #next-btn {
    width: 100%; padding: 13px; border-radius: 12px;
    border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent);
    font-family: 'Gmarket Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s;
  }
  #next-btn:hover { background: var(--accent); color: #111; }

  /* ════ RESULT ════ */
  #result-screen { overflow-y: auto; align-items: center; padding: 28px 16px 48px; }
  .result-inner { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 24px; }
  .result-hero { text-align: center; }
  .result-emoji { font-size: 52px; line-height: 1; margin-bottom: 10px; }
  .result-title { font-family: 'Gmarket Sans', sans-serif; font-size: clamp(20px,5vw,30px); font-weight: 700; letter-spacing: -0.5px; }
  .result-subtitle { font-size: 13px; color: var(--text3); margin-top: 5px; }
  .result-score-wrap { display: flex; gap: 10px; justify-content: center; }
  .score-card { flex: 1; max-width: 120px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; }
  .score-card-val { font-family: 'Gmarket Sans', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
  .score-card-val.c { color: var(--correct); }
  .score-card-val.w { color: var(--wrong); }
  .score-card-val.p { color: var(--accent); }
  .score-card-label { font-size: 10px; color: var(--text3); letter-spacing: 1px; }
  .result-section-title { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
  .result-list { display: flex; flex-direction: column; gap: 8px; }
  .result-item { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .result-item.correct-item { border-color: rgba(107,203,119,0.3); }
  .result-item.wrong-item   { border-color: rgba(255,85,85,0.3); }
  .result-item-num { font-size: 11px; color: var(--text3); width: 18px; flex-shrink: 0; text-align: center; }
  .result-chosung-mini { font-family: 'Gmarket Sans', sans-serif; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; flex-shrink: 0; letter-spacing: 3px; min-width: 52px; text-align: center; }
  .result-item-info { flex: 1; min-width: 0; }
  .result-item-answer { font-size: 14px; font-weight: 700; line-height: 1.3; word-break: keep-all; }
  .result-item-answer.correct-answer { color: var(--correct); }
  .result-item-answer.wrong-answer   { color: var(--wrong); }
  .result-item-chosen { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .result-item-cat { font-size: 10px; color: var(--text3); margin-top: 1px; letter-spacing: 0.5px; font-family: 'Gmarket Sans', sans-serif; }
  .result-btns { display: flex; flex-direction: column; gap: 8px; }
  .result-btn { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: 'Gmarket Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .result-btn:hover { background: var(--surface3); border-color: var(--accent); }
  .result-btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
  .result-btn.primary:hover { filter: brightness(1.08); }
  .result-btn.share { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .result-btn.share:hover { background: var(--accent); color: #111; }

  /* ════ POPUP ════ */
  #popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 500; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  #popup-overlay.show { display: flex; }
  .popup-box { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px 24px 20px; max-width: 320px; width: 100%; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 64px rgba(0,0,0,0.5); }
  .popup-title { font-family: 'Gmarket Sans', sans-serif; font-size: 17px; font-weight: 700; }
  .popup-msg { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .popup-btns { display: flex; gap: 8px; }
  .popup-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: 'Gmarket Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .popup-btn:hover { background: var(--surface3); }
  .popup-btn.confirm { background: var(--accent); border-color: var(--accent); color: #111; }
  .popup-btn.confirm:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div>
    <div class="logo">✦ 올초성 퀴즈</div>
    <div class="logo-sub">초성만 보고 정답 맞추기</div>
  </div>
  <div class="tb-spacer"></div>
  <button id="finish-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    게임 완료하기
  </button>
  <button id="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    처음으로
  </button>
</div>

<!-- ══════════ SETUP ══════════ -->
<div class="screen active" id="setup-screen">
  <div class="setup-inner">
    <div class="setup-hero">
      <div class="setup-eyebrow">chosung quiz</div>
      <h1 class="setup-title">올<em>초성</em><br>퀴즈</h1>
      <p class="setup-desc">초성만 보고 정답을 맞춰보세요</p>
    </div>
    <div class="setup-block">
      <div class="setup-block-label">카테고리 선택 (복수 가능)</div>
      <div class="cat-filters" id="cat-filters"></div>
    </div>
    <div class="setup-block">
      <div class="setup-block-label">문제 수</div>
      <div class="count-btns">
        <button class="count-btn on" data-count="10">10<span class="count-sub">문제</span></button>
        <button class="count-btn" data-count="30">30<span class="count-sub">문제</span></button>
        <button class="count-btn" data-count="50">50<span class="count-sub">문제</span></button>
        <button class="count-btn" data-count="0">∞<span class="count-sub">무한</span></button>
      </div>
    </div>
    <div class="setup-info" id="setup-info"></div>
    <div class="setup-warning" id="setup-warning"></div>
    <button id="start-btn" disabled>게임 시작</button>
  </div>
</div>

<!-- ══════════ QUIZ ══════════ -->
<div class="screen" id="quiz-screen">
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="quiz-status">
    <div class="status-qnum" id="status-qnum">문제 1</div>
    <div class="status-chips">
      <div class="stat-chip"><div class="stat-chip-val c" id="stat-correct">0</div><div class="stat-chip-label">정답</div></div>
      <div class="stat-chip"><div class="stat-chip-val w" id="stat-wrong">0</div><div class="stat-chip-label">오답</div></div>
    </div>
  </div>

  <div id="quiz-scroll">
    <div id="chosung-area">

      <!-- 힌트 토글 + 카테고리 라벨 -->
      <div id="hint-row">
        <button id="hint-toggle">

{id:'',name:'호수의여인',chosung:'ㅎㅅㅇㅇㅇ'},
];

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let selectedCats = new Set();
let quizCount = 10;
let quizPool = [];
let currentIdx = 0;
let correctCount = 0;
let wrongCount = 0;
let quizLog = [];
let answered = false;
let currentItem = null;
let allItemsInGame = [];
let isInfinite = false;
let hintOn = false;   // 힌트 토글 상태

const MANIFEST = {
  categories: CATEGORIES.map(cat => ({
    id: cat.id, label: cat.label,
    items: DATA.filter(d => d.id === cat.id)
  })).filter(cat => cat.items.length > 0)
};

// ══════════════════════════════════════════════
//  SETUP UI
// ══════════════════════════════════════════════
function buildSetupUI() {
  const el = document.getElementById('cat-filters');
  el.innerHTML = '';
  MANIFEST.categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-filter-btn';
    btn.textContent = cat.label;
    btn.dataset.id = cat.id;
    btn.addEventListener('click', () => {
      selectedCats.has(cat.id) ? selectedCats.delete(cat.id) : selectedCats.add(cat.id);
      btn.classList.toggle('on', selectedCats.has(cat.id));
      validateSetup();
    });
    el.appendChild(btn);
  });
}

function validateSetup() {
  const total = MANIFEST.categories.filter(c => selectedCats.has(c.id)).reduce((s,c) => s + c.items.length, 0);
  const warn = document.getElementById('setup-warning');
  const info = document.getElementById('setup-info');
  const btn  = document.getElementById('start-btn');
  if (selectedCats.size === 0) {
    warn.textContent = '카테고리를 1개 이상 선택해주세요'; info.textContent = ''; btn.disabled = true;
  } else if (total < 2) {
    warn.textContent = '항목이 너무 적어요 (최소 2개)'; info.textContent = ''; btn.disabled = true;
  } else {
    warn.textContent = ''; info.textContent = `총 ${total}개 중 출제`; btn.disabled = false;
  }
}

document.querySelectorAll('.count-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    quizCount = parseInt(btn.dataset.count);
  });
});
document.getElementById('start-btn').addEventListener('click', startGame);

// ══════════════════════════════════════════════
//  힌트 토글
// ══════════════════════════════════════════════
document.getElementById('hint-toggle').addEventListener('click', () => {
  hintOn = !hintOn;
  applyHint();
});

function applyHint() {
  const toggle = document.getElementById('hint-toggle');
  const label  = document.getElementById('hint-label');
  if (hintOn) {
    toggle.classList.add('on');
    label.textContent = currentItem ? currentItem.catLabel : '';
    label.classList.add('visible');
  } else {
    toggle.classList.remove('on');
    label.classList.remove('visible');
    // 텍스트는 fade out 후 지움
    setTimeout(() => { if (!hintOn) label.textContent = ''; }, 260);
  }
}

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function normalize(str) { return str.replace(/\s+/g,'').toLowerCase(); }

// ══════════════════════════════════════════════
//  GAME START
// ══════════════════════════════════════════════
function startGame() {
  allItemsInGame = [];
  MANIFEST.categories.forEach(cat => {
    if (!selectedCats.has(cat.id)) return;
    cat.items.forEach(item => allItemsInGame.push({ ...item, catId: cat.id, catLabel: cat.label }));
  });
  isInfinite = quizCount === 0;
  const shuffled = shuffle(allItemsInGame);
  quizPool = isInfinite ? shuffled : shuffled.slice(0, Math.min(quizCount, shuffled.length));
  currentIdx = 0; correctCount = 0; wrongCount = 0; quizLog = []; answered = false;
  showScreen('quiz-screen');
  document.getElementById('back-btn').style.display = 'flex';
  document.getElementById('finish-btn').style.display = isInfinite ? 'flex' : 'none';
  loadQuestion();
}

// ══════════════════════════════════════════════
//  LOAD QUESTION
// ══════════════════════════════════════════════
function getItem(idx) {
  if (isInfinite && idx >= quizPool.length) {
    let next = shuffle(allItemsInGame);
    if (quizPool.length > 0 && next[0].name === quizPool[quizPool.length-1].name) next.push(next.shift());
    quizPool = [...quizPool, ...next];
  }
  return quizPool[idx];
}

function loadQuestion() {
  answered = false;
  document.getElementById('next-btn-wrap').style.display = 'none';

  // 힌트 토글 — 새 문제마다 OFF로 리셋
  hintOn = false;
  applyHint();

  // 카드 초기화
  document.getElementById('chosung-card').className = '';
  document.getElementById('text-swap').className = '';
  document.getElementById('answer-text').className = '';
  document.getElementById('answer-text').textContent = '';
  document.getElementById('answer-badge').className = '';
  document.getElementById('answer-badge').textContent = '';
  document.getElementById('answer-hint').className = '';
  document.getElementById('answer-hint').textContent = '';

  // 입력창 초기화
  const input = document.getElementById('answer-input');
  input.value = ''; input.className = ''; input.disabled = false;
  document.getElementById('submit-btn').disabled = false;

  currentItem = getItem(currentIdx);

  // 초성 표시
  document.getElementById('chosung-text').textContent = currentItem.chosung;

  // 상태 바
  const total = isInfinite ? '∞' : quizPool.length;
  document.getElementById('status-qnum').textContent = `문제 ${currentIdx+1} / ${total}`;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  if (!isInfinite)
    document.getElementById('progress-bar').style.width = `${(currentIdx / quizPool.length) * 100}%`;

  setTimeout(() => input.focus(), 80);
}

// ══════════════════════════════════════════════
//  SUBMIT ANSWER
// ══════════════════════════════════════════════
function submitAnswer() {
  if (answered) return;
  const input = document.getElementById('answer-input');
  const typed = input.value.trim();
  if (!typed) {
    input.classList.add('shake');
    input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
    return;
  }

  answered = true;
  input.disabled = true;
  document.getElementById('submit-btn').disabled = true;

  const isCorrect = normalize(typed) === normalize(currentItem.name);
  isCorrect ? correctCount++ : wrongCount++;
  quizLog.push({ item: currentItem, chosen: typed, isCorrect });

  const card      = document.getElementById('chosung-card');
  const textSwap  = document.getElementById('text-swap');
  const answerEl  = document.getElementById('answer-text');
  const badge     = document.getElementById('answer-badge');
  const hint      = document.getElementById('answer-hint');

  // 정답 텍스트 세팅 후 크로스페이드
  answerEl.textContent = currentItem.name;

  if (isCorrect) {
    card.className    = 'correct-state';
    answerEl.className = 'correct-text';
    input.className   = 'input-correct';
    badge.className   = 'show correct-badge';
    badge.textContent = '정답!';
    hint.textContent  = '';
    hint.className    = '';
  } else {
    card.className    = 'wrong-state';
    answerEl.className = 'wrong-text';
    input.className   = 'input-wrong shake';
    input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
    badge.className   = 'show wrong-badge';
    badge.textContent = '오답';
    hint.className    = 'show';
    hint.textContent  = `내 입력: ${typed}`;
  }

  // 약간 딜레이 후 크로스페이드 (뱃지 애니메이션 타이밍 맞춤)
  setTimeout(() => textSwap.classList.add('revealed'), 120);

  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent   = wrongCount;

  const isLast = !isInfinite && currentIdx >= quizPool.length - 1;
  document.getElementById('next-btn').textContent = isLast ? '결과 보기 →' : '다음 문제 →';
  document.getElementById('next-btn-wrap').style.display = 'block';
}

document.getElementById('submit-btn').addEventListener('click', submitAnswer);
document.getElementById('answer-input').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (!answered) {
    submitAnswer();
  } else {
    // 정답 제출 후 엔터 → 다음 문제 or 결과
    const isLast = !isInfinite && currentIdx >= quizPool.length - 1;
    if (isLast) showResult(); else { currentIdx++; loadQuestion(); }
  }
});
document.getElementById('next-btn').addEventListener('click', () => {
  const isLast = !isInfinite && currentIdx >= quizPool.length - 1;
  if (isLast) showResult(); else { currentIdx++; loadQuestion(); }
});
document.getElementById('finish-btn').addEventListener('click', () => {
  if (quizLog.length === 0) { showPopup('아직 문제를 풀지 않았어요', '최소 1문제를 풀어야 결과를 볼 수 있어요', null); return; }
  showResult();
});

// ══════════════════════════════════════════════
//  RESULT
// ══════════════════════════════════════════════
function showResult() {
  const total = quizLog.length;
  const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  document.getElementById('res-correct').textContent = correctCount;
  document.getElementById('res-wrong').textContent   = wrongCount;
  document.getElementById('res-pct').textContent     = pct + '%';
  document.getElementById('result-subtitle').textContent = `${total}문제 중 ${correctCount}문제 정답`;
  let emoji, title;
  if (pct === 100) { emoji='🏆'; title='완벽해요!'; }
  else if (pct>=80){ emoji='🎉'; title='훌륭해요!'; }
  else if (pct>=60){ emoji='👍'; title='잘했어요!'; }
  else if (pct>=40){ emoji='💪'; title='조금 더 화이팅!'; }
  else             { emoji='🤔'; title='더 연습해봐요!'; }
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;

  const list = document.getElementById('result-list');
  list.innerHTML = '';
  quizLog.forEach((log, i) => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (log.isCorrect ? 'correct-item' : 'wrong-item');
    const num = document.createElement('div'); num.className='result-item-num'; num.textContent=i+1;
    const mini = document.createElement('div'); mini.className='result-chosung-mini'; mini.textContent=log.item.chosung;
    const info = document.createElement('div'); info.className='result-item-info';
    const ans = document.createElement('div');
    ans.className = 'result-item-answer ' + (log.isCorrect ? 'correct-answer' : 'wrong-answer');
    ans.textContent = log.item.name; info.appendChild(ans);
    const cat = document.createElement('div'); cat.className='result-item-cat'; cat.textContent=log.item.catLabel; info.appendChild(cat);
    if (!log.isCorrect) {
      const ch = document.createElement('div'); ch.className='result-item-chosen'; ch.textContent=`내 입력: ${log.chosen}`; info.appendChild(ch);
    }
    item.appendChild(num); item.appendChild(mini); item.appendChild(info);
    list.appendChild(item);
  });

  showScreen('result-screen');
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('finish-btn').style.display = 'none';
  document.getElementById('progress-bar').style.width = '100%';
}

document.getElementById('share-btn').addEventListener('click', () => {
  const total = quizLog.length;
  const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  const cats = [...selectedCats].map(id => { const c=MANIFEST.categories.find(x=>x.id===id); return c?c.label:id.toUpperCase(); }).join(', ');
  const text = `[올초성 퀴즈] ${total}문제 중 ${correctCount}문제 정답 (${pct}%) 🎯\n카테고리: ${cats}\n\n초성만 보고 정답 맞추기!`;
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사됐어요!'));
  else alert(text);
});
document.getElementById('retry-btn').addEventListener('click', startGame);
document.getElementById('setup-again-btn').addEventListener('click', () => {
  showScreen('setup-screen');
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('finish-btn').style.display = 'none';
  validateSetup();
});

// ══════════════════════════════════════════════
//  POPUP
// ══════════════════════════════════════════════
let popupCallback = null;
function showPopup(title, msg, onConfirm) {
  document.getElementById('popup-title').textContent = title;
  document.getElementById('popup-msg').textContent = msg;
  popupCallback = onConfirm;
  document.getElementById('popup-overlay').classList.add('show');
  document.getElementById('popup-confirm').style.display = onConfirm ? 'block' : 'none';
  document.getElementById('popup-cancel').textContent = onConfirm ? '취소' : '확인';
}
document.getElementById('popup-cancel').addEventListener('click', () => document.getElementById('popup-overlay').classList.remove('show'));
document.getElementById('popup-confirm').addEventListener('click', () => { document.getElementById('popup-overlay').classList.remove('show'); if (popupCallback) popupCallback(); });
document.getElementById('popup-overlay').addEventListener('click', e => { if (e.target===document.getElementById('popup-overlay')) document.getElementById('popup-overlay').classList.remove('show'); });
document.getElementById('back-btn').addEventListener('click', () => {
  showPopup('처음으로 돌아갈까요?', '지금까지의 진행상황이 사라져요.', () => {
    showScreen('setup-screen');
    document.getElementById('back-btn').style.display = 'none';
    document.getElementById('finish-btn').style.display = 'none';
    document.getElementById('progress-bar').style.width = '0%';
    validateSetup();
  });
});

// ══════════════════════════════════════════════
//  SCREEN SWITCH
// ══════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

buildSetupUI();
</script>
